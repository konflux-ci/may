name: Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group:
    types: [checks_requested]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
        - "drivers/incluster"
        - "drivers/aws"
        - "may"
        container_tool:
        - "docker"
        - "podman"
        - "buildah"


    defaults:
      run:
        working-directory: "./${{ matrix.component }}"

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Running Tests
        env:
          CONTAINER_TOOL: '${{matrix.container_tool}}'
        run: make docker-build
