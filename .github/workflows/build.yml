name: Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group:
    types: [checks_requested]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
        - "drivers/incluster"
        - "drivers/aws"
        - "may"
        container_tool:
        - "docker"
        - "podman"
        - "buildah"


    defaults:
      run:
        working-directory: "./${{ matrix.component }}"

    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Running Tests
        env:
          CONTAINER_TOOL: '${{matrix.container_tool}}'
        run: make docker-build
