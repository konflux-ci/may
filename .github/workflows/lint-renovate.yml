name: Lint renovate
on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
  # until we have a better solution, always run this workflow during
  # merge_group checks so we can make this check required
  merge_group:
    types: [checks_requested]

jobs:
  lint-renovate:
    name: Verify renovate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.37.4

      - name: Lint manifests
        run: |
          check-jsonschema --builtin-schema vendor.renovate renovate.json
