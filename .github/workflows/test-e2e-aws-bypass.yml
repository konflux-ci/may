# Bypass workflow for a stale required status check.
#
# The AWS driver e2e was moved out of the general E2E matrix (test-e2e.yml) into
# its own workflow, test-e2e-aws.yml (status check "Run AWS Driver E2E"). The
# branch ruleset still requires the old context that the matrix used to emit:
#
#   Run on Ubuntu (drivers/aws, driver-aws-system, control-plane=controller-manager)
#
# No job produces that context anymore, so PRs sit forever "waiting" for it. This
# lightweight workflow reports that exact context as a success so PRs are not
# blocked, without re-running the AWS suite here.

name: E2E Tests Bypass

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group:
    types: [checks_requested]

jobs:
  aws-e2e-bypass:
    name: "Run on Ubuntu (drivers/aws, driver-aws-system, control-plane=controller-manager)"
    runs-on: ubuntu-latest
    steps:
      - name: Bypass check
        run: echo "AWS driver e2e now runs in test-e2e-aws.yml (status check 'Run AWS Driver E2E')."
